name: Windows build and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: pwsh

jobs:
  format:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned formatter
        run: |
          python -m pip install --disable-pip-version-check clang-format==18.1.8
          if ($LASTEXITCODE -ne 0) { throw 'Formatter installation failed.' }
      - name: Check project source formatting
        run: ./scripts/Format.ps1 -Check

  build:
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, x86]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build, analyze, test and check imports and size
        env:
          TARGET_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          & ./build.ps1 -Architecture $env:TARGET_ARCHITECTURE -Configuration Release -Analyze *>&1 |
            Tee-Object -FilePath "out/ci-$env:TARGET_ARCHITECTURE.log"
          if ($LASTEXITCODE -ne 0) { throw 'Windows build checks failed.' }
      - name: Keep binaries and build manifests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binaries-${{ matrix.architecture }}
          path: |
            dist/*.exe
            dist/*.exe.build.json
          if-no-files-found: error
          retention-days: 14
      - name: Keep diagnostics and symbols
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diagnostics-${{ matrix.architecture }}
          path: |
            out/ci-*.log
            out/build/${{ matrix.architecture }}-Release/Testing/Temporary/
            out/symbols/
          if-no-files-found: warn
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, format]
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Preserve existing releases
        id: existing
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw 'Use a numeric vMAJOR.MINOR.PATCH tag matching CMake ProductVersion.' }
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $url = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag"
          try {
            $null = Invoke-RestMethod -Uri $url -Headers $headers
            'exists=true' >> $env:GITHUB_OUTPUT
            Write-Host 'This tag already has a release. Its notes and assets are preserved.'
          } catch {
            if ([int]$_.Exception.Response.StatusCode -ne 404) { throw }
            'exists=false' >> $env:GITHUB_OUTPUT
          }
      - name: Download verified x64 binary
        if: steps.existing.outputs.exists == 'false'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: binaries-x64
          path: dist
      - name: Verify standalone executable
        if: steps.existing.outputs.exists == 'false'
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $binaryPath = 'dist/VisPick.exe'
          $manifestPath = "$binaryPath.build.json"
          if (-not (Test-Path -LiteralPath $binaryPath -PathType Leaf) -or
              -not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
            throw 'The verified x64 executable and build manifest are required.'
          }
          . ./scripts/BuildSource.ps1
          $buildSource = Get-VisPickBuildSource $env:GITHUB_WORKSPACE
          $build = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $binary = Get-Item -LiteralPath $binaryPath
          if ($build.name -ne 'VisPick.exe' -or $build.architecture -ne 'x64' -or
              $build.version -ne $version -or $binary.VersionInfo.ProductVersion -ne $version -or
              $binary.Length -le 0 -or $binary.Length -gt 2MB -or $build.bytes -ne $binary.Length -or
              $build.source_sha256 -ne $buildSource -or
              $build.sha256 -ne (Get-FileHash -LiteralPath $binaryPath -Algorithm SHA256).Hash) {
            throw 'The release executable does not match the version, build manifest, source inputs, or 2 MiB size limit.'
          }
      - name: Publish a new tagged release
        if: steps.existing.outputs.exists == 'false'
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.Substring(1)
          $notes = "docs/releases/VisPick-$version.md"
          $hasVersionNotes = Test-Path -LiteralPath $notes -PathType Leaf
          $releaseBody = if ($hasVersionNotes) { Get-Content -LiteralPath $notes -Raw } else { '' }
          $binary = Get-Item -LiteralPath 'dist/VisPick.exe'
          $binaryHash = (Get-FileHash -LiteralPath $binary.FullName -Algorithm SHA256).Hash
          $assetDetails = @(
            '', '## 本次发布附件', '',
            ('文件：`{0}`（Windows x64）' -f $binary.Name), '',
            ('大小：{0} 字节。' -f $binary.Length), '',
            ('SHA256：`{0}`' -f $binaryHash), '',
            '以上为本次上传文件的实际校验值；仓库文档中的历史构建校验值可能不同。'
          )
          New-Item -ItemType Directory -Force out | Out-Null
          $releaseNotes = "out/release-$version.md"
          (@($releaseBody.TrimEnd()) + $assetDetails) |
            Set-Content -LiteralPath $releaseNotes -Encoding utf8NoBOM
          $arguments = @('release', 'create', $tag, 'dist/VisPick.exe',
            '--repo', $env:GITHUB_REPOSITORY, '--verify-tag', '--title', "VisPick $version Windows portable",
            '--notes-file', $releaseNotes)
          if (-not $hasVersionNotes) { $arguments += '--generate-notes' }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release creation failed. Existing releases were not overwritten.' }
