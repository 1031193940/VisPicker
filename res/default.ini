; ======================================================================
;  VisPick 配置文件 —— 保存后自动生效，无需重启
;  · 删除本文件后重新启动程序，会重新生成默认配置
;  · 以 ; 开头的行是注释；行尾注释用“空格 + ;”
;  · 开关：true / false；百分比：0–100 的整数；颜色：#RRGGBB
; ======================================================================

[Hotkeys]
; 写法：Ctrl / Alt / Shift / Win + 键，例如 Ctrl+1、Ctrl+Alt+A、F1；留空表示不启用
; 注意：全局热键会覆盖其他软件中的相同快捷键（例如浏览器用 Ctrl+1 切换标签页）
Screenshot   = Ctrl+1      ; 划区域截图，选区后可贴图、复制到剪贴板或保存文件
Gif          = Ctrl+2      ; 划区域录制 GIF（录制中再按一次 = 停止）
PinClipboard =             ; 把剪贴板中的图片钉到屏幕上（托盘菜单中也可使用）
TogglePins   =             ; 隐藏 / 显示全部参考图（托盘菜单中也可使用）

[Capture]
WindowSnap    = true       ; 自动识别窗口，单击即选中整个窗口
Magnifier     = true       ; 显示放大镜、坐标和颜色值
MaskOpacity   = 45         ; 选区外遮罩的不透明度
IncludeCursor = false      ; 截图中包含鼠标指针

[Save]
Folder     = {pictures}            ; “保存”对话框的默认目录；可用 {pictures} {desktop} {exe_dir} 和 %环境变量%
FileName   = VisPick_{date}_{time} ; 默认文件名；可用 {date} {time} {ms} {w} {h}
Format     = png                   ; 截图的默认保存格式：png / jpg / bmp
JpgQuality = 92            ; 1–100（产品质量范围）

[Editor]
Color       = #FF3B30      ; 默认标注颜色
StrokeWidth = 4            ; 默认线宽（逻辑像素）：2 / 4 / 6
FontSize    = 20           ; 默认字号（逻辑像素）：14 / 20 / 28
FontName    = Microsoft YaHei
MosaicSize  = 10           ; 马赛克块大小（逻辑像素），1–256

[Pin]
Instant          = false   ; true：从托盘「参考图」或 --pin 进入时，松开鼠标立即贴图
Topmost          = true    ; 参考图总在最前
Border           = true
BorderColor      = #3A7AFE ; 选中时的边框颜色
Shadow           = true
Opacity          = 100     ; 新参考图的不透明度
InactiveOpacity  = 100     ; 未选中时的不透明度（小于 100 可让参考图不那么抢眼）
Wheel            = zoom    ; 滚轮：zoom 缩放 / opacity 透明度（按住 Ctrl 时为另一种）
ZoomStep         = 10      ; 每次缩放的百分比，1–100
Smooth           = true    ; 放大时平滑；false 为像素化显示
SnapDistance     = 10      ; 拖动吸附距离（逻辑像素），0–256；0 表示关闭
DustBox          = 5       ; 回收站保留最近关闭的参考图数量，0–100
CompactMode      = crop    ; 双击收缩：crop = 以双击点为中心的原尺寸局部（SETUNA 原版）/ thumbnail = 整图缩略图
CompactSize      = 50      ; 收缩方块边长（逻辑像素），1–2048
CompactOpacity   = 80
CompactLineColor = #0000FF

[Gif]
Fps             = 30       ; 默认帧率，1–50；每次选区后也可以更改
ShowCursor      = true     ; 录制鼠标指针
HighlightClicks = false    ; 鼠标按下时显示高亮圈
Dither          = false    ; 抖动：渐变和照片更平滑，但文件更大
Scale           = 100      ; 输出缩放上限，1–100；auto 按 DPI 换算；超过内存预算时自动降低分辨率

[Advanced]
capture_layered_gif = false ; true：录制时尝试捕获分层窗口。默认沿用 SRCCOPY 路径

[General]
TrayClick = screenshot     ; 左键单击托盘图标：screenshot / gif / pin / none
Language  = auto           ; auto / zh-CN / en
Log       = false          ; 诊断日志依次尝试 exe 目录、%APPDATA%\VisPick、%TEMP%\VisPick
